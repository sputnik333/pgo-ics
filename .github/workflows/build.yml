name: Build calendar.ics

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ICS
        run: python build_ics.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add calendar.ics
          # Ignore DTSTAMP-only changes so it doesn't commit every run
          if git diff --cached -I '^DTSTAMP:' --quiet; then
            echo "No changes"; git reset -q
          else
            git commit -m "Update calendar.ics" && git push
          fi
